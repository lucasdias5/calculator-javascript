<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculadora</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="calculadora">

    <section class="visor" role="status" aria-live="polite">
      <p class="visor__historico" id="historico"></p>
      <p class="visor__resultado" id="resultado">0</p>
    </section>

    <section class="teclado" aria-label="Teclado da calculadora">

      <button class="tecla tecla--acao" data-acao="limpar" aria-label="Limpar tudo">AC</button>
      <button class="tecla tecla--acao" data-acao="apagar" aria-label="Apagar último dígito">⌫</button>
      <button class="tecla tecla--acao" data-acao="porcentagem" aria-label="Porcentagem">%</button>
      <button class="tecla tecla--operador" data-operador="/" aria-label="Dividir">÷</button>

      <button class="tecla" data-numero="7">7</button>
      <button class="tecla" data-numero="8">8</button>
      <button class="tecla" data-numero="9">9</button>
      <button class="tecla tecla--operador" data-operador="*" aria-label="Multiplicar">×</button>

      <button class="tecla" data-numero="4">4</button>
      <button class="tecla" data-numero="5">5</button>
      <button class="tecla" data-numero="6">6</button>
      <button class="tecla tecla--operador" data-operador="-" aria-label="Subtrair">−</button>

      <button class="tecla" data-numero="1">1</button>
      <button class="tecla" data-numero="2">2</button>
      <button class="tecla" data-numero="3">3</button>
      <button class="tecla tecla--operador" data-operador="+" aria-label="Somar">+</button>

      <button class="tecla tecla--acao" data-acao="inverter" aria-label="Inverter sinal">±</button>
      <button class="tecla" data-numero="0">0</button>
      <button class="tecla" data-acao="decimal" aria-label="Vírgula decimal">,</button>
      <button class="tecla tecla--igual" data-acao="igual" aria-label="Calcular resultado">=</button>

    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
