<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculator</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="calculator">

    <!-- Display: history shows the ongoing expression, result shows the current number -->
    <section class="display" role="status" aria-live="polite">
      <p class="display__history" id="history"></p>
      <p class="display__result" id="result">0</p>
    </section>

    <!--
      Keypad: each button has a data-* attribute so JavaScript knows what to do:
        data-number   -> digits from 0 to 9
        data-operator -> + - * /
        data-action   -> clear, delete, percent, negate, decimal, equals
    -->
    <section class="keypad" aria-label="Calculator keypad">

      <button class="key key--action" data-action="clear" aria-label="Clear all">AC</button>
      <button class="key key--action" data-action="delete" aria-label="Delete last digit">⌫</button>
      <button class="key key--action" data-action="percent" aria-label="Percent">%</button>
      <button class="key key--operator" data-operator="/" aria-label="Divide">÷</button>

      <button class="key" data-number="7">7</button>
      <button class="key" data-number="8">8</button>
      <button class="key" data-number="9">9</button>
      <button class="key key--operator" data-operator="*" aria-label="Multiply">×</button>

      <button class="key" data-number="4">4</button>
      <button class="key" data-number="5">5</button>
      <button class="key" data-number="6">6</button>
      <button class="key key--operator" data-operator="-" aria-label="Subtract">−</button>

      <button class="key" data-number="1">1</button>
      <button class="key" data-number="2">2</button>
      <button class="key" data-number="3">3</button>
      <button class="key key--operator" data-operator="+" aria-label="Add">+</button>

      <button class="key key--action" data-action="negate" aria-label="Toggle sign">±</button>
      <button class="key" data-number="0">0</button>
      <button class="key" data-action="decimal" aria-label="Decimal point">.</button>
      <button class="key key--equals" data-action="equals" aria-label="Calculate result">=</button>

    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
